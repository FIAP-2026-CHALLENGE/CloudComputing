# CLYVO VET API - pipeline CI/CD da Sprint 4 (Azure DevOps)
#
# CI: restore, build, testes automáticos, publish do artefato "drop" e,
#     na main, docker build e push da imagem para o Azure Container Registry.
# CD: só na main, depois do CI verde; cria ou atualiza o container no
#     Azure Container Instances com a imagem da run e os segredos do vg-sprint4.
#
# Dispara a cada commit na main. PRs para a develop rodam só o CI (validação).

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - develop

pool:
  vmImage: 'ubuntu-24.04'

variables:
  - group: vg-sprint4
  - name: buildConfiguration
    value: 'Release'
  - name: acrName
    value: 'acrsprint4rm562822'
  - name: acrLoginServer
    value: 'acrsprint4rm562822.azurecr.io'
  - name: imageRepository
    value: 'cloudcomputing-api'
  - name: resourceGroup
    value: 'rg-sprint4-rm562822'
  - name: aciName
    value: 'aci-cloudcomputing-rm562822'
  - name: aciDnsLabel
    value: 'cloudcomputing-rm562822'
  - name: location
    value: 'eastus2'

stages:
- stage: CI
  displayName: 'CI - Build, Testes e Artefato'
  jobs:
  - job: Build
    displayName: 'Compilar, testar e publicar'
    steps:
    - task: UseDotNet@2
      displayName: 'Instalar .NET SDK 10'
      inputs:
        packageType: 'sdk'
        version: '10.0.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore (baixar pacotes NuGet)'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Testes automáticos (xUnit)'
      inputs:
        command: 'test'
        projects: '**/*Tests.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build'

    - task: DotNetCoreCLI@2
      displayName: 'Publish (gera os binários da API)'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'src/DotNet.Api/DotNet.Api.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/api'
        zipAfterPublish: true

    - task: PublishPipelineArtifact@1
      displayName: 'Publicar artefato (drop)'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'drop'
        publishLocation: 'pipeline'
  
    - task: AzureCLI@2
      displayName: 'Docker build e push para o ACR (só na main)'
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      inputs:
        azureSubscription: 'sc-azure-sprint4'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az acr login --name $(acrName)
          docker build -t $(acrLoginServer)/$(imageRepository):$(Build.BuildId) -t $(acrLoginServer)/$(imageRepository):latest .
          docker push $(acrLoginServer)/$(imageRepository):$(Build.BuildId)
          docker push $(acrLoginServer)/$(imageRepository):latest

- stage: CD
  displayName: 'CD - Deploy no ACI'
  dependsOn: CI
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployACI
    displayName: 'Criar ou atualizar o container no ACI'
    environment: 'aci-producao'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'Deploy do container no ACI'
            env:
              ORACLE_CONN: $(ORACLE_CONNECTION)
              JWT_KEY: $(JWT_KEY)
              AUTH_USUARIO: $(AUTH_USUARIO)
              AUTH_SENHA: $(AUTH_SENHA)
            inputs:
              azureSubscription: 'sc-azure-sprint4'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Para antes do deploy se algum secret não chegou do vg-sprint4:
                # sem Jwt__Key (32+ caracteres) a API não sobe e o container reinicia em loop.
                for NOME in ORACLE_CONN JWT_KEY AUTH_USUARIO AUTH_SENHA; do
                  VALOR="${!NOME}"
                  if [ -z "$VALOR" ] || [[ "$VALOR" == '$('* ]]; then
                    echo "##vso[task.logissue type=error]Secret $NOME ausente no variable group vg-sprint4."
                    exit 1
                  fi
                done
                if [ ${#JWT_KEY} -lt 32 ]; then
                  echo "##vso[task.logissue type=error]JWT_KEY precisa ter 32 caracteres ou mais."
                  exit 1
                fi

                ACR_USER=$(az acr credential show --name $(acrName) --query username -o tsv)
                ACR_PASS=$(az acr credential show --name $(acrName) --query "passwords[0].value" -o tsv)

                az container create \
                  --resource-group $(resourceGroup) \
                  --name $(aciName) \
                  --image $(acrLoginServer)/$(imageRepository):$(Build.BuildId) \
                  --registry-login-server $(acrLoginServer) \
                  --registry-username "$ACR_USER" \
                  --registry-password "$ACR_PASS" \
                  --os-type Linux \
                  --cpu 1 \
                  --memory 1.5 \
                  --ports 8080 \
                  --ip-address Public \
                  --dns-name-label $(aciDnsLabel) \
                  --location $(location) \
                  --restart-policy Always \
                  --environment-variables Swagger__Habilitado=true \
                  --secure-environment-variables \
                    ConnectionStrings__OracleConnection="$ORACLE_CONN" \
                    Jwt__Key="$JWT_KEY" \
                    Auth__Usuario="$AUTH_USUARIO" \
                    Auth__Senha="$AUTH_SENHA"

                az container show --resource-group $(resourceGroup) --name $(aciName) --query "{url:ipAddress.fqdn, estado:instanceView.state}" -o table